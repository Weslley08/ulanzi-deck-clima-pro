name: Weekly security check

# Catches problems found after a release, when no pull request would run the checks.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run setup
      - name: Known vulnerabilities in dependencies
        run: npm run audit
      - name: Build and verify what users would receive
        run: |
          npm run package
          npm run verify:package
      - name: Secrets in the repository and the zip
        run: npm run check:secrets
      # The SDK is copied into the plugin, so npm audit and Dependabot never see it.
      - name: Ulanzi SDK copies and upstream changes
        run: npm run check:sdk -- --upstream
