name: After develop

on:
  push:
    branches: [develop]

permissions:
  contents: read

# Merges close together must see each other's pull requests.
concurrency:
  group: after-develop

jobs:
  next:
    # Creating the branch is also a push, with nothing merged.
    if: github.repository == 'Weslley08/ulanzi-deck-clima-pro' && !github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job pushes the bump/ branches.
          token: ${{ secrets.AUTOMATION_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/flow.mjs after-develop
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          GH_REPO: ${{ github.repository }}
