name: Delivery

# The jobs are in Weslley08/ulanzi-plugin-pipeline. This file says when they run and what differs for this plugin.
on:
  push:
    branches:
      # Keep these in step with WORK_PREFIXES in the pipeline's scripts/lib/flow.mjs.
      - feature/**
      - feat/**
      - fix/**
      - chore/**
      - docs/**
      - refactor/**
      - test/**
      - ci/**
      - build/**
      - perf/**
      - develop
      - main
      - release/v*

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  # On a release branch, a newer merge makes validating the older one pointless.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  delivery:
    uses: Weslley08/ulanzi-plugin-pipeline/.github/workflows/delivery.yml@feat/maintainer-approval
    with:
      # The environment gives the key to release/v* branches only, so no other branch's workflow can read it.
      integrations-scripts: test:live test:live:alerts
      integrations-environment: release-validation
      integrations-secret: WEATHERAPI_KEY
    # GitHub only hands the environment's secret to a called workflow this way. Passed by name, it arrives empty.
    secrets: inherit
