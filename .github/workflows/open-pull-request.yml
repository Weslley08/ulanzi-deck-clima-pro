name: Open pull request

# Keep this list in step with WORK_PREFIXES in scripts/lib/flow.mjs.
on:
  push:
    branches:
      - feature/**
      - feat/**
      - fix/**
      - chore/**
      - docs/**
      - refactor/**
      - test/**
      - ci/**
      - build/**
      - perf/**

permissions:
  contents: read

jobs:
  open:
    # A fork has no AUTOMATION_TOKEN, and its author opens the pull request here by hand.
    if: github.repository == 'Weslley08/ulanzi-deck-clima-pro' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/flow.mjs open-pull-request
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
