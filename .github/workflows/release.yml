name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: The tag must match every version in the repository
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for file in com.ulanzi.climapro.ulanziPlugin/manifest.json; do
            found=$(node -p "JSON.parse(require('fs').readFileSync('$file','utf8')).Version")
            test "$found" = "$version" || { echo "$file says $found, tag says $version"; exit 1; }
          done
          for file in package.json com.ulanzi.climapro.ulanziPlugin/package.json; do
            found=$(node -p "JSON.parse(require('fs').readFileSync('$file','utf8')).version")
            test "$found" = "$version" || { echo "$file says $found, tag says $version"; exit 1; }
          done
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit
      - run: npm run check:sdk
      - run: npm run package
      - run: npm run verify:package
      - run: npm run check:secrets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-zip
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-zip
          path: dist
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # A draft on purpose: a person tests it on a real deck, adds the numbers from
        # npm run measure, and only then publishes it. CI cannot see the device.
        run: |
          cd dist
          sha256sum ./*.zip > SHA256SUMS.txt
          gh release create "$TAG" ./*.zip SHA256SUMS.txt --draft --verify-tag --title "$TAG" --generate-notes
