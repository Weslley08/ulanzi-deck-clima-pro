name: Publish

# Only a release branch can reach main, and only after a person ticked the device box and merged.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'Weslley08/ulanzi-deck-clima-pro'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/flow.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
