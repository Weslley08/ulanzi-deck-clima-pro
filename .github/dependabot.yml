version: 2
updates:
  - package-ecosystem: npm
    directory: /com.ulanzi.climapro.ulanziPlugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      fonts:
        patterns: ['@fontsource/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
